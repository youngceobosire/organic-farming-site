<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | YOUNG CEO ORGANIC FARM</title>
  <style>
    :root{--green:#1d4d3b;--green2:#2d6a4f;--pale:#edf6ee;--ink:#203027;--muted:#617067;--danger:#a93636;--line:#dce8df}*{box-sizing:border-box}body{margin:0;background:#f7faf7;color:var(--ink);font-family:Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{width:min(1120px,calc(100% - 32px));margin:auto}.top{background:var(--green);color:#fff;padding:20px 0}.top-inner{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:800;letter-spacing:.04em}.muted{color:var(--muted)}.login{max-width:460px;margin:80px auto;background:#fff;padding:32px;border-radius:20px;box-shadow:0 15px 40px #173e2414}.login h1{margin-top:0;color:var(--green)}.field{margin:16px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}.field textarea{min-height:100px;resize:vertical}.btn{border:0;border-radius:10px;padding:12px 18px;background:var(--green2);color:#fff;font-weight:700}.btn.secondary{background:var(--pale);color:var(--green)}.btn.danger{background:#fff0f0;color:var(--danger)}.hidden{display:none!important}.notice{padding:12px 14px;border-radius:10px;background:#fff3cd;color:#735b00;margin:15px 0}.error{background:#fff0f0;color:var(--danger)}.dashboard{padding:32px 0 70px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:20px;box-shadow:0 8px 25px #173e2408}.card h2{color:var(--green);margin-top:0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.product{border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}.product-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.product-head h3{margin:0;color:var(--green)}.product img{width:100px;height:70px;object-fit:cover;border-radius:8px}.product-row{display:flex;gap:14px;align-items:flex-start}.status{font-weight:700;color:var(--green2);min-height:24px}@media(max-width:760px){.grid{grid-template-columns:1fr}.top-inner{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <header class="top"><div class="shell top-inner"><div class="brand">YOUNG CEO ORGANIC FARM · ADMIN</div><button id="logout" class="btn secondary hidden">Log out</button></div></header>
  <main class="shell">
    <section id="loginView" class="login">
      <h1>Admin login</h1>
      <p class="muted">Manage farm content, prices, and images securely.</p>
      <div id="loginMessage" class="notice hidden"></div>
      <form id="loginForm">
        <div class="field"><label for="email">Admin email</label><input id="email" type="email" required autocomplete="email"></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"></div>
        <button class="btn" type="submit">Sign in</button>
      </form>
    </section>

    <section id="dashboard" class="dashboard hidden">
      <div class="status" id="status"></div>
      <div class="grid">
        <div class="card"><h2>Homepage settings</h2>
          <form id="settingsForm">
            <div class="field"><label for="heroTitle">Hero title</label><input id="heroTitle" required></div>
            <div class="field"><label for="heroText">Hero description</label><textarea id="heroText" required></textarea></div>
            <div class="field"><label for="aboutText">About text</label><textarea id="aboutText" required></textarea></div>
            <div class="field"><label for="phone">Phone</label><input id="phone" required></div>
            <div class="field"><label for="emailSetting">Public email</label><input id="emailSetting" type="email"></div>
            <div class="actions"><button class="btn" type="submit">Save settings</button></div>
          </form>
        </div>
        <div class="card"><h2>Add product</h2>
          <form id="productForm">
            <div class="field"><label for="productName">Name</label><input id="productName" required></div>
            <div class="field"><label for="productCategory">Category</label><input id="productCategory" required></div>
            <div class="field"><label for="productPrice">Price (KSh)</label><input id="productPrice" type="number" min="0" step="1" required></div>
            <div class="field"><label for="productDescription">Description</label><textarea id="productDescription" required></textarea></div>
            <div class="field"><label for="productImage">Product image</label><input id="productImage" type="file" accept="image/*"></div>
            <div class="actions"><button class="btn" type="submit">Add product</button></div>
          </form>
        </div>
      </div>
      <div class="card"><h2>Products</h2><div id="products"></div></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
